services:
  - type: web
    name: eduadapt-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eduadapt-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.4

databases:
  - name: eduadapt-db
    databaseName: eduadapt_prod
    user: eduadapt_user
    plan: free
