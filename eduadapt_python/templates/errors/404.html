{% extends "base.html" %}

{% block title %}404 Not Found – EduAdapt-AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm p-5 rounded-4 bg-white">
        <div class="display-1 text-primary fw-bold mb-2">404</div>
        <h4 class="fw-bold mb-2">Page Not Found</h4>
        <p class="text-muted small mb-4">
          The requested page, subject, or lesson topic could not be found. Please check the URL or return to the main dashboard.
        </p>
        <div class="d-grid gap-2">
          <a href="{{ url_for('learning.dashboard') if g.user else url_for('learning.home') }}" class="btn btn-primary fw-semibold">
            <i class="bi bi-house-door-fill me-1"></i> Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
