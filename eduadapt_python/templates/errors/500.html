{% extends "base.html" %}

{% block title %}500 Internal Server Error – EduAdapt-AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm p-5 rounded-4 bg-white">
        <div class="display-1 text-warning fw-bold mb-2">500</div>
        <h4 class="fw-bold mb-2">System Error</h4>
        <p class="text-muted small mb-4">
          An unexpected server error occurred. Our automated error recovery has rolled back any pending database operations.
        </p>
        <div class="d-grid gap-2">
          <a href="{{ url_for('learning.dashboard') if g.user else url_for('learning.home') }}" class="btn btn-primary fw-semibold">
            <i class="bi bi-arrow-clockwise me-1"></i> Return to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
