{% extends "base.html" %}

{% block title %}Create Account – EduAdapt-AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
              <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h3 class="fw-bold">Student Registration</h3>
            <p class="text-muted small">Join EduAdapt-AI and unlock personalized computer science mastery</p>
          </div>

          <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
              <label for="name" class="form-label fw-semibold small">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="name" name="name" value="{{ name if name else '' }}" placeholder="e.g. Sahasra Kumar" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" value="{{ email if email else '' }}" placeholder="student@example.com" required>
              </div>
              <div class="form-text small">We will never share your email address.</div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-sm-6">
                <label for="password" class="form-label fw-semibold small">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 chars" required minlength="6">
                </div>
              </div>
              <div class="col-sm-6">
                <label for="confirm_password" class="form-label fw-semibold small">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat password" required minlength="6">
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-check-circle me-1"></i> Register Free & Start Learning
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none ms-1">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
