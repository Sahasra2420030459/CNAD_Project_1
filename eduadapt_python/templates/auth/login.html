{% extends "base.html" %}

{% block title %}Sign In – EduAdapt-AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
              <i class="bi bi-box-arrow-in-right fs-2"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to resume your personalized learning journey</p>
          </div>

          <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" value="{{ email if email else '' }}" placeholder="student@example.com" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label fw-semibold small mb-0">Password</label>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="remember" name="remember" value="1">
              <label class="form-check-label small text-muted" for="remember">Keep me signed in on this device</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">New to EduAdapt-AI?</span>
            <a href="{{ url_for('auth.register') }}" class="fw-semibold text-decoration-none ms-1">Create an account</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
