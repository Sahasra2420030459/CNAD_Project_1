name: Cloud Deployment Pipeline (Disabled by Default)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Deployment Target (render / railway / azure)'
        required: true
        default: 'render'
      confirm_deployment:
        description: 'Type "DEPLOY" to confirm execution'
        required: true

jobs:
  gatekeeper:
    name: Validate Approval & Pre-checks
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deployment }}" != "DEPLOY" ]; then
            echo "Deployment cancelled: Confirmation string must be DEPLOY."
            exit 1
          fi
          echo "Deployment confirmed for target: ${{ github.event.inputs.target_environment }}"

  deploy-backend:
    name: Build & Publish Backend Image
    needs: gatekeeper
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_deployment == 'DEPLOY'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (Optional)
        if: env.REGISTRY_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: videoplatform-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
