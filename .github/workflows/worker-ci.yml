name: Worker CI - Build & Test

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
      - 'pom.xml'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'worker/**'
      - 'pom.xml'
      - '.github/workflows/worker-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Video Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install FFmpeg for Real Integration Verification
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Build & Run Worker Unit Tests
        run: |
          cd worker
          mvn clean test --batch-mode

      - name: Package Worker JAR
        run: |
          cd worker
          mvn package -DskipTests --batch-mode

      - name: Upload Worker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-jar
          path: worker/target/*.jar
          retention-days: 7
