spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:videoplatform}?useSSL=${DB_USE_SSL:true}&requireSSL=${DB_USE_SSL:true}&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

storage:
  type: azure
  azure:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container-name: ${AZURE_BLOB_CONTAINER_NAME:video-processing}

queue:
  type: azure
  azure:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    queue-name: ${AZURE_QUEUE_NAME:video-compression-jobs}

worker:
  embedded:
    enabled: false
