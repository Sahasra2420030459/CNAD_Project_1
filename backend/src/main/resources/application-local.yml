spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:videoplatform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-path: ${LOCAL_STORAGE_PATH:./uploads}

queue:
  type: ${QUEUE_TYPE:local}

worker:
  embedded:
    enabled: ${EMBEDDED_WORKER_ENABLED:true}
  poll-interval-ms: 3000
