services:
  - type: web
    name: videoplatform-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_TYPE
        value: local
      - key: QUEUE_TYPE
        value: local
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
