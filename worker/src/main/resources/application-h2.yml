spring:
  datasource:
    url: jdbc:h2:file:./data/videoplatform;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

storage:
  type: local
  local:
    base-path: ./uploads

queue:
  type: local

worker:
  ffmpeg:
    simulation-mode: ${WORKER_FFMPEG_SIMULATION_MODE:auto}
